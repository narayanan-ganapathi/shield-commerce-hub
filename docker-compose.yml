version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: ecom_postgres_engine
    environment:
      POSTGRES_USER: shield_admin
      POSTGRES_PASSWORD: vault_secret_password
      POSTGRES_DB: shield_storefront
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data-scripts/schema.sql:/docker-entrypoint-initdb.d/init_schema.sql

volumes:
  pgdata:
